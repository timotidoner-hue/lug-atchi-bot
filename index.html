<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video yuklovchi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8edf3;--ink:#13233a;--mute:#5d6b80;--card:#fff;--acc:#ffd23f;--err:#b3261e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:48px 20px}
h1{font-size:clamp(2rem,7vw,3.2rem);line-height:1.05;font-weight:800;margin:0 0 28px;letter-spacing:-.02em}
form{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1 1 260px;padding:15px 16px;border:2px solid var(--ink);border-radius:10px;font:inherit;background:var(--card);color:var(--ink)}
button{font:600 1rem "Bricolage Grotesque",system-ui,sans-serif;cursor:pointer;border-radius:10px;border:2px solid var(--ink);padding:14px 20px;background:var(--acc);color:var(--ink)}
button:disabled{opacity:.55;cursor:wait}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#status{min-height:1.6em;margin:14px 0 0;color:var(--mute)}
#status.err{color:var(--err);font-weight:600}
#result{margin-top:22px;background:var(--card);border:2px solid var(--ink);border-radius:14px;overflow:hidden}
#result img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.body{padding:18px 20px 22px}
.body h2{font-size:1.15rem;margin:0 0 2px;line-height:1.3}
.meta{margin:0 0 16px;color:var(--mute);font-size:.95rem}
#choices{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
#choices button{background:var(--card);padding:9px 16px}
#choices button[aria-pressed=true]{background:var(--ink);color:#fff}
#go{width:100%}
@media(prefers-reduced-motion:no-preference){button{transition:transform .08s}button:active{transform:translateY(1px)}}
</style>
</head>
<body>
<main>
  <h1>Havolani qo'ying, videoni oling.</h1>
  <form id="form">
    <input id="url" type="url" required placeholder="https://www.youtube.com/watch?v=..." aria-label="YouTube havolasi">
    <button id="find">Topish</button>
  </form>
  <p id="status" role="status"></p>
  <section id="result" hidden>
    <img id="thumb" alt="">
    <div class="body">
      <h2 id="title"></h2>
      <p class="meta" id="meta"></p>
      <div id="choices" role="group" aria-label="Format"></div>
      <button id="go">Yuklab olish</button>
    </div>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
let url = "", pick = null, title = "video";

function status(msg, err = false) { const s = $("#status"); s.textContent = msg; s.className = err ? "err" : ""; }
function fmt(sec) { if (!sec) return ""; const m = Math.floor(sec / 60), s = String(sec % 60).padStart(2, "0"); return m + ":" + s; }

$("#form").onsubmit = async e => {
  e.preventDefault();
  url = $("#url").value.trim();
  $("#find").disabled = true; $("#result").hidden = true; status("Qidirilmoqda…");
  try {
    const r = await fetch("/api/info?url=" + encodeURIComponent(url));
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || "Xatolik yuz berdi.");
    show(d); status("");
  } catch (err) { status(err.message, true); }
  $("#find").disabled = false;
};

function show(d) {
  title = (d.title || "video").replace(/[\\/:*?"<>|]/g, "");
  $("#thumb").src = d.thumbnail || "";
  $("#title").textContent = d.title;
  $("#meta").textContent = [d.uploader, fmt(d.duration)].filter(Boolean).join(" · ");
  const opts = d.heights.map(h => ({ kind: "video", height: h, label: h + "p video" }));
  opts.push({ kind: "audio", label: "MP3 audio" });
  const box = $("#choices"); box.innerHTML = "";
  opts.forEach((o, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = o.label;
    b.onclick = () => { pick = o; [...box.children].forEach(x => x.setAttribute("aria-pressed", x === b)); };
    box.append(b);
    if (i === 0) b.click();
  });
  $("#result").hidden = false;
}

$("#go").onclick = async () => {
  const btn = $("#go"); btn.disabled = true;
  status("Tayyorlanmoqda… katta videolar bir necha daqiqa olishi mumkin.");
  try {
    const q = new URLSearchParams({ url, kind: pick.kind, height: pick.height || 720 });
    const r = await fetch("/api/download?" + q);
    if (!r.ok) throw new Error((await r.json()).detail || "Yuklab bo'lmadi.");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(await r.blob());
    a.download = title + (pick.kind === "audio" ? ".mp3" : ".mp4");
    a.click(); URL.revokeObjectURL(a.href);
    status("Tayyor. Fayl yuklab olindi.");
  } catch (err) { status(err.message, true); }
  btn.disabled = false;
};
</script>
</body>
</html>
